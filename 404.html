<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Halaman Tidak Ditemukan | JAGOMELEDAK</title>

  <!-- Halaman error tidak perlu masuk Google -->
  <meta name="robots" content="noindex,follow">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #ff7a00;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .page-wrapper {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #ffffff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111111;
      padding: 18px 20px;
      text-align: center;
    }

    .brand {
      color: #ff9d00;
      font-size: 28px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .brand span {
      color: #ffffff;
    }

    .error-content {
      flex: 1;
      padding: 55px 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .error-code {
      margin: 0;
      color: #ff7a00;
      font-size: 92px;
      line-height: 1;
      font-weight: 900;
    }

    .error-title {
      margin: 20px 0 12px;
      color: #111111;
      font-size: 27px;
      line-height: 1.3;
    }

    .error-description {
      margin: 0 auto 30px;
      max-width: 330px;
      color: #555555;
      font-size: 15px;
      line-height: 1.7;
    }

    .home-button {
      display: inline-block;
      width: 100%;
      max-width: 270px;
      margin: 0 auto;
      padding: 15px 20px;
      background: #ff7a00;
      border: 2px solid #ff7a00;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .home-button:hover {
      background: #111111;
      border-color: #111111;
    }

    .footer {
      padding: 17px;
      background: #111111;
      color: #dddddd;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        background: #ffffff;
      }

      .page-wrapper {
        max-width: none;
        box-shadow: none;
      }

      .error-code {
        font-size: 78px;
      }

      .error-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrapper">

    <header class="header">
      <a href="/" class="brand">LEDAK<span>SLOT</span></a>
    </header>

    <section class="error-content">
      <p class="error-code">404</p>

      <h1 class="error-title">Halaman Tidak Ditemukan</h1>

      <p class="error-description">
        Alamat yang Anda buka mungkin sudah dipindahkan, dihapus,
        atau tidak pernah tersedia. Silakan kembali ke halaman utama.
      </p>

      <a href="/" class="home-button">
        KEMBALI KE BERANDA
      </a>
    </section>

    <footer class="footer">
      &copy; 2026 JAGOMELEDAK. Semua hak dilindungi.
    </footer>

  </main>

</body>
</html>
